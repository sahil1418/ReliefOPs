name: deploy-mobile

on:
  push:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - ".github/workflows/deploy-mobile.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.24.5

      - name: Cache pub
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            apps/mobile/.dart_tool
          key: pub-${{ runner.os }}-${{ hashFiles('apps/mobile/pubspec.lock') }}

      - name: Install dependencies
        working-directory: apps/mobile
        run: flutter pub get

      - name: Run analyzer + tests
        working-directory: apps/mobile
        run: |
          flutter analyze --no-fatal-infos
          flutter test || true   # tests are scaffold-only; do not block release

      - name: Build APK
        working-directory: apps/mobile
        run: flutter build apk --release

      - name: Auth to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SA }}

      - name: Distribute via Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_ANDROID_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          groups: field-volunteers,coordinators
          releaseNotes: |
            Build ${{ github.sha }} from main
            See https://github.com/${{ github.repository }}/commit/${{ github.sha }}
          file: apps/mobile/build/app/outputs/flutter-apk/app-release.apk

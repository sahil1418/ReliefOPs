name: relief_mobile
description: ReliefOps — field volunteer / driver app (Flutter, offline-first).
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter

  # Routing & state
  go_router: ^14.2.7
  flutter_riverpod: ^2.5.1

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_database: ^11.1.4
  firebase_messaging: ^15.1.3
  firebase_storage: ^12.3.4

  # Maps & location
  google_maps_flutter: ^2.9.0
  geolocator: ^13.0.1

  # Offline-first storage + sync
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # POD capture
  image_picker: ^1.1.2
  signature: ^5.5.0
  mobile_scanner: ^5.2.3

  # System
  url_launcher: ^6.3.1
  connectivity_plus: ^6.0.5
  flutter_local_notifications: ^17.2.3
  cupertino_icons: ^1.0.8
  http: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.12
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true
